<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - HF Points System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .card h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: #58a6ff; }
        .btn { width: 100%; padding: 12px; background-color: #1f6feb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #388bfd; }
        .footer-text { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #8b949e; }
        .footer-text a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تسجيل الدخول 🔑</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="loginUser" placeholder="اسمك..." required>
            </div>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">دخول</button>
        </form>
        <div class="footer-text">
            معندكش حساب؟ <a href="register.html">اعمل حساب جديد من هنا</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            let users = JSON.parse(localStorage.getItem('hf_users')) || [];

            // التحقق من صحة البيانات
            const foundUser = users.find(u => u.username === user && u.password === pass);

            if (foundUser) {
                alert('أهلاً بيك يا ' + user + '! تم تسجيل الدخول بنجاح 🔥');
                // هنا تقدر تحوله لصفحة النقاط الرئيسية لو عامل لها ملف تاني
            } else {
                alert('اسم المستخدم أو كلمة السر غلط! أو لسه معملتش حساب.');
            }
        });
    </script>
</body>
</html>
