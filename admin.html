<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - الأدمن ⚡</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .member-item, .complaint-item {
      background: var(--input-bg, #1f2937);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .complaint-item {
      border-right: 4px solid #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>لوحة تحكم الأدمن ⚡</h1>
      <p>إدارة الأعضاء، النقاط، الشكاوى، وتعليم البوت</p>
    </header>

    <!-- قائمة الأعضاء -->
    <div class="card">
      <h2>👥 قائمة الأعضاء للتحكم</h2>
      <div id="adminMembersList"></div>
    </div>

    <!-- قسم الشكاوى للرد عليها -->
    <div class="card" style="margin-top: 20px;">
      <h2>📩 شكاوى الأعضاء</h2>
      <div id="adminComplaintsList"></div>
    </div>

    <!-- قسم تعليم البوت -->
    <div class="card" style="margin-top: 20px;">
      <h2>🧠 تعليم البوت المساعد</h2>
      <div id="unknownQuestionsList"></div>
      <hr style="border-color: #374151; margin: 15px 0;">
      <h3>إضافة معلومة جديدة للبوت مباشرة:</h3>
      <form id="learnForm">
        <input type="text" id="customQuestion" placeholder="السؤال" required><br><br>
        <textarea id="customAnswer" placeholder="إجابة البوت..." required style="width:100%; height:80px; padding:8px; border-radius:5px; background:var(--input-bg, #1f2937); color:#fff; border:1px solid #4b5563;"></textarea><br><br>
        <button type="submit" class="btn btn-success">حفظ في ذاكرة البوت 🧠</button>
      </form>
    </div>

    <br>
    <a href="index.html" class="btn" style="width: 100%; background-color: #4b5563;">الرجوع للرئيسية</a>
  </div>

  <script src="app.js"></script>
  <script>
    function renderAdminMembers() {
      const listDiv = document.getElementById('adminMembersList');
      const users = typeof getUsers === 'function' ? getUsers() : [];
      if (users.length === 0) {
        listDiv.innerHTML = '<p style="color: #9ca3af; text-align: center;">لا يوجد أعضاء مسجلين.</p>';
        return;
      }
      listDiv.innerHTML = users.map((user, index) => `
        <div class="member-item" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong>${user.username}</strong> - النقاط: <span style="color:#3b82f6;">${user.points || 100}</span>
          </div>
          <div>
            <button onclick="modifyPoints(${index}, 10)" class="btn btn-success" style="padding:4px 8px; font-size:12px; width:auto;">+10</button>
            <button onclick="modifyPoints(${index}, -10)" class="btn btn-warning" style="padding:4px 8px; font-size:12px; width:auto;">-10</button>
            <button onclick="deleteMember(${index})" class="btn btn-danger" style="padding:4px 8px; font-size:12px; width:auto;">حذف 🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function modifyPoints(index, amount) {
      let users = getUsers();
      if (users[index]) {
        users[index].points = (users[index].points || 100) + amount;
        if (users[index].points < 0) users[index].points = 0;
        saveUsers(users);
        renderAdminMembers();
      }
    }

    function deleteMember(index) {
      let users = getUsers();
      if (confirm(`حذف ${users[index].username}؟`)) {
        users.splice(index, 1);
        saveUsers(users);
        renderAdminMembers();
      }
    }

    // عرض الشكاوى والرد عليها
    function renderAdminComplaints() {
      const listDiv = document.getElementById('adminComplaintsList');
      const complaints = typeof getComplaints === 'function' ? getComplaints() : [];

      if (complaints.length === 0) {
        listDiv.innerHTML = '<p style="color: #10b981;">لا توجد شكاوى حالياً! 🎉</p>';
        return;
      }

      listDiv.innerHTML = complaints.map(c => `
        <div class="complaint-item">
          <div><strong>👤 العضو:</strong> ${c.username} <span style="font-size:11px; color:#9ca3af;">(${c.date})</span></div>
          <div style="margin: 6px 0;"><strong>الشكوى:</strong> ${c.text}</div>
          ${c.reply ? `<div style="color:#10b981; font-size:13px;"><strong>الرد الحالي:</strong> ${c.reply}</div>` : ''}
          <button onclick="replyComplaintPrompt(${c.id})" class="btn btn-warning" style="padding:4px 10px; font-size:12px; width:auto; margin-top:6px;">
            ${c.reply ? 'تعديل الرد ✏️' : 'الرد على الشكوى 💬'}
          </button>
        </div>
      `).join('');
    }

    function replyComplaintPrompt(id) {
      const reply = prompt("اكتب ردك على هذا العضو:");
      if (reply) {
        replyToComplaint(id, reply);
        alert('تم إرسال الرد بنجاح وسوف يظهر للعضو في صندوق الوارد 👁️‍🗨️!');
        renderAdminComplaints();
      }
    }

    function renderUnknownQuestions() {
      const listDiv = document.getElementById('unknownQuestionsList');
      const unknown = typeof getUnknownQuestions === 'function' ? getUnknownQuestions() : [];
      if (unknown.length === 0) {
        listDiv.innerHTML = '<p style="color: #10b981;">لا توجد أسئلة مجهولة.</p>';
        return;
      }
      listDiv.innerHTML = unknown.map(q => `
        <div style="background:#1f2937; padding:10px; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
          <span>❓ <b>${q}</b></span>
          <button onclick="quickTeach('${q}')" class="btn btn-warning" style="width:auto; padding:4px 10px; font-size:12px;">إجابة 💡</button>
        </div>
      `).join('');
    }

    function quickTeach(q) {
      const ans = prompt(`إجابة السؤال: "${q}"`);
      if (ans && typeof learnBotQuestion === 'function') {
        learnBotQuestion(q, ans);
        renderUnknownQuestions();
      }
    }

    document.getElementById('learnForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('customQuestion').value;
      const a = document.getElementById('customAnswer').value;
      if (typeof learnBotQuestion === 'function') {
        learnBotQuestion(q, a);
        document.getElementById('customQuestion').value = '';
        document.getElementById('customAnswer').value = '';
        renderUnknownQuestions();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderAdminMembers();
      renderAdminComplaints();
      renderUnknownQuestions();
    });
  </script>
</body>
</html>
