<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل العمليات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>سجل العمليات</h1>
    </header>

    <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <span>جميع التحركات المسجلة:</span>
      <button id="clearLogsBtn" class="btn btn-danger">🗑️ مسح السجل بالكامل</button>
    </div>

    <ul id="logsList" class="logs-list"></ul>

    <br>
    <a href="index.html" class="btn" style="width: 100%; background-color: #6b7280;">الرجوع للرئيسية</a>
  </div>

  <script src="app.js"></script>
  <script>
    const logsList = document.getElementById('logsList');

    function renderLogs() {
      const logs = getLogs();
      logsList.innerHTML = '';

      if (logs.length === 0) {
        logsList.innerHTML = '<li class="card" style="text-align: center;">لا يوجد أي عمليات مسجلة حتى الآن.</li>';
        return;
      }

      logs.forEach(log => {
        const li = document.createElement('li');
        li.className = 'log-item';
        li.innerHTML = `
          <span>${log.action}</span>
          <span class="log-date">📅 ${log.date} | ⏰ ${log.time}</span>
        `;
        logsList.appendChild(li);
      });
    }

    document.getElementById('clearLogsBtn').addEventListener('click', () => {
      if (confirm("هل تريد مسح سجل العمليات بالكامل؟")) {
        localStorage.removeItem('hf_logs');
        renderLogs();
      }
    });

    renderLogs();
  </script>
</body>
</html>
