<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي الشخصي</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .avatar-wrapper {
      text-align: center;
      margin-bottom: 20px;
    }
    .avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      background-color: var(--input-bg);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>الملف الشخصي 👤</h1>
    </header>

    <div class="card">
      <!-- الصورة الشخصية -->
      <div class="avatar-wrapper">
        <img id="avatarPreview" src="https://via.placeholder.com/100?text=👤" class="avatar-img" alt="صورة الملف الشخصي">
        <div style="margin-top: 10px;">
          <input type="file" id="avatarInput" accept="image/*" style="display: none;">
          <button id="uploadAvatarBtn" class="btn" style="padding: 5px 12px; font-size: 13px;">📷 تغيير الصورة</button>
        </div>
      </div>

      <!-- تفاصيل الحساب والنقاط -->
      <div style="background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>اسم المستخدم:</strong> <span id="profileUsername"></span></p>
        <p style="margin-top: 8px;"><strong>البريد الإلكتروني:</strong> <span id="profileEmail"></span></p>
        <hr style="margin: 12px 0; border: none; border-top: 1px solid var(--border-color);">
        <p><strong>النقاط في النظام:</strong> <span id="profilePoints">جاري التحميل...</span></p>
        <p style="margin-top: 8px;"><strong>حالة العضوية:</strong> <span id="profileStatus">...</span></p>
      </div>

      <!-- تغيير كلمة المرور -->
      <h3>تغيير كلمة المرور 🔑</h3>
      <form id="changePasswordForm">
        <div class="form-group">
          <input type="password" id="oldPasswordInput" required placeholder="كلمة المرور القديمة">
        </div>
        <div class="form-group">
          <input type="password" id="newPasswordInput" required placeholder="كلمة المرور الجديدة">
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">تحديث كلمة المرور</button>
      </form>

      <br>
      <a href="index.html" class="btn" style="width: 100%; background-color: #4b5563;">الرجوع للرئيسية</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    checkAuthRequirement();

    const currentUser = getCurrentUser();

    // عرض بيانات الحساب
    document.getElementById('profileUsername').textContent = currentUser.username;
    document.getElementById('profileEmail').textContent = currentUser.email || 'غير مسجل';

    // عرض الصورة إن وجدت
    if (currentUser.avatar) {
      document.getElementById('avatarPreview').src = currentUser.avatar;
    }

    // مطابقة اسم الحساب مع قائمة الأعضاء وجلب النقاط
    const members = getMembers();
    const matchedMember = members.find(m => m.name.trim().toLowerCase() === currentUser.username.trim().toLowerCase());

    if (matchedMember) {
      const status = calculateStatus(matchedMember.points);
      document.getElementById('profilePoints').textContent = `${matchedMember.points} نقطة`;
      document.getElementById('profileStatus').textContent = `${status.icon} ${status.text}`;
    } else {
      document.getElementById('profilePoints').textContent = "لم يتم ربطه بعضو في قائمة الأعضاء";
      document.getElementById('profileStatus').textContent = "غير معروف ⚪";
    }

    // رفع وتغيير الصورة
    document.getElementById('uploadAvatarBtn').addEventListener('click', () => {
      document.getElementById('avatarInput').click();
    });

    document.getElementById('avatarInput').addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imageBase64 = e.target.result;
          document.getElementById('avatarPreview').src = imageBase64;
          
          currentUser.avatar = imageBase64;
          updateCurrentUserSession(currentUser);
          alert("تم حفظ الصورة الشخصية بنجاح!");
        };
        reader.readAsDataURL(file);
      }
    });

    // تغيير كلمة المرور
    document.getElementById('changePasswordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const oldPass = document.getElementById('oldPasswordInput').value;
      const newPass = document.getElementById('newPasswordInput').value;

      if (oldPass !== currentUser.password) {
        alert("كلمة المرور القديمة غير صحيحة!");
        return;
      }

      currentUser.password = newPass;
      updateCurrentUserSession(currentUser);

      alert("تم تغيير كلمة المرور بنجاح!");
      document.getElementById('changePasswordForm').reset();
    });
  </script>
</body>
</html>
