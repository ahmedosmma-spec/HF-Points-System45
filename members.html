<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة الأعضاء</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>قائمة الأعضاء</h1>
    </header>

    <div class="card">
      <div class="form-group">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن عضو بالاسم...">
      </div>
    </div>

    <div id="membersContainer" class="members-grid"></div>

    <br>
    <a href="index.html" class="btn" style="width: 100%; background-color: #6b7280;">الرجوع للرئيسية</a>
  </div>

  <script src="app.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    const membersContainer = document.getElementById('membersContainer');

    function renderMembers(filterText = '') {
      const members = getMembers();
      membersContainer.innerHTML = '';

      const filtered = members.filter(m => m.name.toLowerCase().includes(filterText.toLowerCase()));

      if (filtered.length === 0) {
        membersContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا يوجد أعضاء.</p>';
        return;
      }

      filtered.forEach(member => {
        const status = calculateStatus(member.points);
        const card = document.createElement('div');
        card.className = 'member-card';
        card.innerHTML = `
          <h3>👤 ${member.name}</h3>
          <div>💯 النقاط: <strong>${member.points}</strong></div>
          <div class="status-tag">${status.icon} ${status.text}</div>
          <a href="member-settings.html?id=${member.id}" class="btn">⚙️ الإعدادات</a>
        `;
        membersContainer.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      renderMembers(e.target.value);
    });

    renderMembers();
  </script>
</body>
</html>
