<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقديم شكوى - HF Points System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>تقديم شكوى 😔</h1>
      <p>اكتب مشكلتك أو اعتراضك وسيقوم الأدمن بمراجعته والرد عليك في صندوق الوارد 👁️‍🗨️</p>
    </header>

    <div class="card">
      <form id="complaintForm">
        <label for="complaintText" style="display:block; margin-bottom:8px; font-weight:bold;">تفاصيل الشكوى:</label>
        <textarea 
          id="complaintText" 
          placeholder="اكتب شكواك هنا بالتفصيل..." 
          required 
          style="width:100%; height:120px; padding:10px; border-radius:8px; background:var(--input-bg, #1f2937); color:#fff; border:1px solid #4b5563; font-family:inherit; resize:vertical;"
        ></textarea>
        <br><br>
        <button type="submit" class="btn btn-danger" style="width: 100%;">إرسال الشكوى 📩</button>
      </form>
      <br>
      <a href="index.html" class="btn" style="width: 100%; background-color: #4b5563;">الرجوع للرئيسية</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // التأكد من تسجيل الدخول
    if (typeof checkAuthRequirement === 'function') {
      checkAuthRequirement();
    }

    // إرسال الشكوى عند الضغط على الزر
    document.getElementById('complaintForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('complaintText').value.trim();

      if (!text) {
        alert('يرجى كتابة الشكوى أولاً!');
        return;
      }

      // إرسال الشكوى باستخدام الدالة الموجودة في app.js
      if (typeof sendComplaint === 'function') {
        sendComplaint(text);
        document.getElementById('complaintText').value = '';
        window.location.href = 'index.html'; // العودة للرئيسية بعد الإرسال
      } else {
        // حماية في حالة عدم وجود الدالة في app.js
        const currentUser = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
        if (!currentUser) {
          alert('يرجى تسجيل الدخول أولاً!');
          return;
        }

        const complaints = JSON.parse(localStorage.getItem('hf_complaints')) || [];
        complaints.push({
          id: Date.now(),
          username: currentUser.username,
          text: text,
          reply: null,
          read: false,
          date: new Date().toLocaleDateString('ar-EG')
        });
        localStorage.setItem('hf_complaints', JSON.stringify(complaints));

        alert('تم إرسال الشكوى للأدمن بنجاح! 🎉');
        document.getElementById('complaintText').value = '';
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
