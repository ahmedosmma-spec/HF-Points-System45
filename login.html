<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - HF Points System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: var(--input-bg, #1f2937);
      color: #fff;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container auth-container">
    <header>
      <h1>تسجيل الدخول 🔑</h1>
      <p>أدخل بياناتك للوصول إلى لوحة HF Points</p>
    </header>

    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">اسم المستخدم:</label>
          <input type="text" id="username" placeholder="اكتب اسمك هنا..." required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور:</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور..." required>
        </div>

        <br>
        <button type="submit" class="btn btn-success" style="width: 100%;">دخول 🚀</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // لو العضو مسجل دخول بالفعل، ينقله تلقائياً للرئيسية
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof getCurrentUser === 'function') {
        const currentUser = getCurrentUser();
        if (currentUser && currentUser.username) {
          window.location.href = 'index.html';
        }
      }
    });

    // معالجة نموذج تسجيل الدخول
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();

      if (!userVal || !passVal) {
        alert('يرجى ملء جميع الحقول!');
        return;
      }

      // البحث عن المستخدم في المسجلين
      const users = typeof getUsers === 'function' ? getUsers() : (JSON.parse(localStorage.getItem('hf_users')) || []);
      const foundUser = users.find(u => u.username === userVal && u.password === passVal);

      if (foundUser) {
        // حفظ بيانات تسجيل الدخول
        localStorage.setItem('hf_current_user', JSON.stringify(foundUser));
        alert(`أهلاً بك مجدداً يا ${foundUser.username} 👋`);
        window.location.href = 'index.html';
      } else {
        alert('اسم المستخدم أو كلمة المرور غير صحيحة! ❌');
      }
    });
  </script>
</body>
</html>
