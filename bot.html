<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد الذكي 🤖</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-box {
      height: 380px;
      overflow-y: auto;
      background: var(--input-bg, #1f2937);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 82%;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .bot-msg {
      background-color: #374151;
      color: #fff;
      align-self: flex-start;
      border-bottom-right-radius: 2px;
      white-space: pre-line;
    }
    .user-msg {
      background-color: #2563eb;
      color: #fff;
      align-self: flex-end;
      border-bottom-left-radius: 2px;
    }
    .quick-questions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .quick-btn {
      background: #4b5563;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .quick-btn:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>المساعد الذكي 🤖</h1>
      <p>أنا هنا لمساعدتك والإجابة على استفساراتك بنظام HF</p>
    </header>

    <div class="card">
      <!-- نافذة المحادثة -->
      <div id="chatBox" class="chat-box"></div>

      <!-- أسئلة سريعة -->
      <div class="quick-questions">
        <button class="quick-btn" onclick="sendQuickMsg('ازاي اغير كلمه المرور')">🔑 تغيير الباسورد</button>
        <button class="quick-btn" onclick="sendQuickMsg('ازاي نظام النقاط شغال؟')">💡 نظام النقاط</button>
        <button class="quick-btn" onclick="sendQuickMsg('ازاي اقدم شكوى؟')">😔 تقديم شكوى</button>
        <button class="quick-btn" onclick="sendQuickMsg('امتى ترجع نقاطي 100؟')">🔄 استعادة النقاط</button>
      </div>
      <br>

      <!-- نموذج إرسال الرسالة -->
      <form id="chatForm" style="display: flex; gap: 8px;">
        <input type="text" id="userInput" placeholder="اسألني أي سؤال عن النظام..." required style="flex: 1;">
        <button type="submit" class="btn btn-success" style="width: auto; padding: 0 20px;">إرسال 🚀</button>
      </form>

      <br>
      <a href="index.html" class="btn" style="width: 100%; background-color: #4b5563;">الرجوع للرئيسية</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // التأكد من جلب البيانات والأدوات بأمان
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');

    // رسالة الترحيب عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      let username = 'يا بطل';
      if (typeof getCurrentUser === 'function') {
        const u = getCurrentUser();
        if (u && u.username) username = u.username;
      }
      
      const welcomeText = `أهلاً بك يا ${username} 👋! أنا البوت المساعد.\nاسألني عن النقاط، تغيير كلمة المرور، أو تقديم الشكاوى وهرد عليك فوراً!`;
      appendMessage(welcomeText, 'bot-msg');
    });

    function match(q, keywords) {
      return keywords.some(key => q.includes(key));
    }

    // محرك الردود الذكي والآمن
    function getSmartBotReply(input) {
      const q = input.toLowerCase().trim();

      // 1. ذاكرة الأدمن المتعلمة (لو موجودة)
      if (typeof getBotBrain === 'function') {
        const brain = getBotBrain();
        for (let savedQuestion in brain) {
          if (q.includes(savedQuestion) || savedQuestion.includes(q)) {
            return brain[savedQuestion];
          }
        }
      }

      // 2. حماية كلمة مرور الأدمن 🛡️
      if ((q.includes('ادمن') || q.includes('أدمن')) && 
          (q.includes('كود') || q.includes('باسورد') || q.includes('سر') || q.includes('رمز') || q.includes('0899'))) {
        return "عفواً 🛑! كلمة مرور الأدمن سرية للغاية ولا يمكنني الإفصاح عنها!";
      }

      // 3. تغيير كلمة المرور / الباسورد
      if (q.includes('باسورد') || q.includes('كلمه المرور') || q.includes('كلمة المرور') || q.includes('السر') || q.includes('اغير')) {
        return "لتغيير كلمة المرور الخاصة بحسابك 🔑:\n1️⃣ اذهب لصفحة 'الحساب 👤' من الرئيسية.\n2️⃣ اكتب كلمة المرور القديمة ثم الجديدة واضغط تحديث.";
      }

      // 4. تغيير الصورة
      if (q.includes('صورة') || q.includes('صوره') || q.includes('بروفايل')) {
        return "لتغيير صورتك الشخصية 📷:\n1️⃣ ادخل على صفحة 'الحساب 👤'.\n2️⃣ اضغط على زر 'تغيير الصورة' واختر الصورة المناسبة.";
      }

      // 5. النقاط
      if (q.includes('نقط') || q.includes('نقاط') || q.includes('درجات')) {
        return "نظام النقاط كالتالي:\n- يبدأ العضو بـ 100 نقطة 🟢\n- من 50 لـ 100: حالة طبيعية 🟢\n- أقل من 50: تحت المراقبة 🟡\n- 0 نقطة: مطرود 🔴";
      }

      // 6. استعادة النقاط
      if (q.includes('استعادة') || q.includes('ترجع') || q.includes('يرجع') || q.includes('30')) {
        return "النظام بيعوضك تلقائياً 🔄! لو مرت 30 يوم كاملة بدون أي خصم جديد، نقاطك بترجع 100 تلقائياً.";
      }

      // 7. الشكاوى
      if (q.includes('شكوى') || q.includes('اشتكي') || q.includes('مشكلة') || q.includes('مظلوم')) {
        return "لو عندك مشكلة، اضغط على زر 'اشتكي😔' في الرئيسية واكتب شكواك، والأدمن هيراجعها بنفسه 😑.";
      }

      // 8. التحية
      if (match(q, ['سلام', 'مرحبا', 'اهلاً', 'اهلا', 'ازيك', 'عامل ايه', 'صباح', 'مساء', 'هلا'])) {
        return "أهلاً بك! 🌟 أنا جاهز لمساعدتك في أي وقت.";
      }

      // 9. الشتائم أو نقد البوت
      if (match(q, ['غبي', 'حمار', 'مش فاهم', 'سيء'])) {
        return "حقك عليّ! 😔 جرب تسألني بصياغة تانية أو اختار من الأزرار السريعة بالأعلى!";
      }

      // حفظ السؤال المجهول للأدمن
      if (typeof saveUnknownQuestion === 'function') {
        saveUnknownQuestion(input);
      }
      
      return "سؤال جديد عليّ! 🤔 سجلت سؤالك والأدمن هيعلمني إجابته قريباً.. تقدر تسألني حالياً عن النقاط، الباسورد، أو الشكاوى!";
    }

    // إرسال الرسالة
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      processMessage(text);
    });

    function sendQuickMsg(text) {
      processMessage(text);
    }

    function processMessage(text) {
      appendMessage(text, 'user-msg');
      userInput.value = '';

      setTimeout(() => {
        const reply = getSmartBotReply(text);
        appendMessage(reply, 'bot-msg');
      }, 300);
    }

    function appendMessage(msgText, className) {
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.textContent = msgText;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
