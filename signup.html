<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 450px; margin: 40px auto 0 auto;">
      <header>
        <h2>إنشاء حساب جديد 📝</h2>
        <p>قم بإنشاء حسابك للانضمام إلى النظام</p>
      </header>

      <form id="signupForm">
        <div class="form-group">
          <label for="regUsername">اسم المستخدم:</label>
          <input type="text" id="regUsername" required placeholder="مثال: ahmed_dev">
        </div>
        <div class="form-group">
          <label for="regEmail">البريد الإلكتروني (اختياري):</label>
          <input type="email" id="regEmail" placeholder="name@example.com (اختياري)">
        </div>
        <div class="form-group">
          <label for="regPassword">كلمة المرور:</label>
          <input type="password" id="regPassword" required placeholder="كلمة المرور">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; background-color: var(--primary);">تسجيل الحساب</button>
      </form>

      <br>
      <div style="text-align: center; font-size: 14px; color: var(--text-secondary);">
        لديك حساب بالفعل؟ <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      const result = registerUser(username, email, password);

      if (result.success) {
        alert("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.");
        window.location.href = 'login.html';
      } else {
        alert(result.message);
      }
    });
  </script>
</body>
</html>
