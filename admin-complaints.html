
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | الأدمن ⚡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>لوحة التحكم بالأدمن ⚡</h1>
      <p>مرحباً بك! يمكنك الوصول لجميع صلاحيات النظام مباشرة.</p>
    </header>

    <div class="card" style="display: grid; gap: 12px;">
      <a href="add-member.html" class="btn btn-success">➕ إضافة عضو جديد</a>
      <a href="members.html" class="btn">👥 قائمة الأعضاء والتحكم بالنقاط</a>
      <a href="admin-complaints.html" class="btn btn-danger">اسمع الشكاوي😑</a>
      <a href="logs.html" class="btn btn-warning">📜 سجل العمليات الكامل</a>
      <button id="logoutBtn" class="btn btn-danger" style="background-color: #991b1b;">🚪 تسجيل الخروج من الأدمن</button>
    </div>

    <a href="index.html" class="btn" style="width: 100%; background-color: #4b5563;">الرجوع للرئيسية</a>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isAdminLoggedIn()) {
      const pass = prompt("أدخل كلمة مرور الأدمن للوصول لهذه الصفحة:");
      if (pass === '0899') {
        loginAdmin();
      } else {
        alert("كلمة المرور غير صحيحة!");
        window.location.href = 'index.html';
      }
    }

    // زر خروج الأدمن مع رسالة التأكيد
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm("هل أنت متأكد من الخروج من وضع الأدمن؟")) {
        logoutAdmin();
        alert("تم تسجيل الخروج من وضع الأدمن.");
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
